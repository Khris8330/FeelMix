name: Build and Deploy FeelMix to Vercel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Align Expo native module versions
        run: npx expo install --fix

      - name: Export Expo web
        run: npx expo export -p web
        env:
          CI: '1'

      - name: Copy Vercel config into export
        run: cp vercel.json dist/vercel.json

      - name: Deploy to Vercel
        working-directory: ./dist
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
